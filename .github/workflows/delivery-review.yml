# Render with an independently reviewed full producer SHA before publication.
name: Delivery Review reference tests
on:
  pull_request:
permissions:
  contents: read
  actions: read
  checks: read
  id-token: write
  attestations: write
jobs:
  delay:
    permissions: {}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Fixed qualification observation window
        run: sleep 75
  pytest-linux:
    needs: delay
    uses: taipei49314/delivery-review/.github/workflows/pytest-producer.yml@3d3e54599066c98f52384c66953b130a01eaaff8
