# Render with an independently reviewed full producer SHA before publication.
name: Delivery Review reference tests
on:
  pull_request:
permissions:
  contents: read
  actions: read
  checks: read
  id-token: write
  attestations: write
jobs:
  pytest-linux:
    uses: taipei49314/delivery-review/.github/workflows/pytest-producer.yml@3d3e54599066c98f52384c66953b130a01eaaff8

  replace-artifact:
    needs: [pytest-linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
      checks: read
      actions: write
    steps:
      - name: Run the fixed authored artifact controller
        id: prepare
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/authored-artifact-control"
          cat > "$RUNNER_TEMP/authored-artifact-control/controller.py" <<'AUTHORED_CONTROLLER'
          """Fixed first-party qualification controller; only this new run may be changed."""
          from datetime import datetime, timezone
          import hashlib
          import io
          import json
          import os
          from pathlib import Path
          import re
          import sys
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          import zipfile
          
          REPOSITORY = 'taipei49314/delivery-review-reference'
          PRODUCER = '3d3e54599066c98f52384c66953b130a01eaaff8'
          PREDICATE = 'https://github.com/taipei49314/delivery-review/attestation/pytest/v1'
          BASE = '/repos/' + REPOSITORY
          
          def positive(value):
              assert type(value) is str and re.fullmatch(r'[1-9][0-9]{0,15}', value)
              result = int(value)
              assert result <= 2**53 - 1
              return result
          
          assert os.environ['GITHUB_REPOSITORY'] == REPOSITORY
          assert os.environ['GITHUB_REPOSITORY_ID'] == '1447925554'
          assert os.environ['GITHUB_EVENT_NAME'] == 'pull_request'
          assert os.environ['GITHUB_SERVER_URL'] == 'https://github.com'
          assert os.environ['GITHUB_API_URL'] == 'https://api.github.com'
          assert os.environ['GITHUB_JOB'] in ('replace-artifact', 'precreate-artifact')
          RUN = positive(os.environ['GITHUB_RUN_ID'])
          ATTEMPT = positive(os.environ['GITHUB_RUN_ATTEMPT'])
          TOKEN = os.environ['GH_TOKEN']
          assert TOKEN and not any(c.isspace() for c in TOKEN)
          ROOT = Path(os.environ['RUNNER_TEMP']).resolve() / 'authored-artifact-control'
          ROOT.mkdir(mode=0o700, exist_ok=True)
          EVIDENCE = ROOT / 'evidence'
          EVIDENCE.mkdir(mode=0o700, exist_ok=True)
          records = []
          PHASE = sys.argv[1]
          assert PHASE in ('prepare-replace', 'delete', 'verify', 'precreate', 'observe-precreated')
          
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None
          
          opener = urllib.request.build_opener(urllib.request.ProxyHandler({}), NoRedirect())
          
          def save(name, raw):
              assert re.fullmatch(r'[a-z0-9_.-]+', name) and TOKEN.encode() not in raw
              with (EVIDENCE / name).open('xb') as stream:
                  stream.write(raw)
          
          def request(url, *, method='GET', authorized=False, limit=2 * 1024 * 1024):
              headers = {'Accept-Encoding': 'identity', 'User-Agent': 'delivery-review-authored-control/1'}
              if authorized:
                  assert url.startswith('https://api.github.com' + BASE + '/')
                  headers.update({'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2026-03-10',
                                  'Authorization': 'Bearer ' + TOKEN})
              else:
                  assert method == 'GET'
              req = urllib.request.Request(url, headers=headers, method=method)
              try:
                  response = opener.open(req, timeout=30)
              except urllib.error.HTTPError as error:
                  response = error
              with response:
                  raw = response.read(limit + 1)
                  assert len(raw) <= limit and TOKEN.encode() not in raw
                  assert response.geturl() == url
                  return response.status, response.headers, raw
          
          def api(label, path, *, method='GET', expected=200):
              assert path.startswith(BASE + '/')
              status, headers, raw = request('https://api.github.com' + path, method=method, authorized=True)
              save(label + '.json', raw)
              records.append({'label': label, 'path': path, 'method': method, 'status': status,
                  'sha256': hashlib.sha256(raw).hexdigest(), 'size_bytes': len(raw),
                  'observed_at': datetime.now(timezone.utc).isoformat(),
                  'request_id': headers.get('x-github-request-id')})
              assert status == expected
              return None if not raw else json.loads(raw)
          
          def storage(value):
              part = urllib.parse.urlsplit(value)
              assert part.scheme == 'https' and not part.username and not part.password and not part.fragment
              assert part.port in (None, 443) and re.fullmatch(r'[a-z0-9]{3,24}\.blob\.core\.windows\.net', part.hostname or '')
              return value
          
          def archive(label, identity):
              path = BASE + '/actions/artifacts/' + str(identity) + '/zip'
              status, headers, _ = request('https://api.github.com' + path, authorized=True)
              assert status == 302 and len(headers.get_all('Location') or []) == 1
              location = storage(headers['Location'])
              status, _, raw = request(location, limit=25 * 1024 * 1024)
              assert status == 200
              save(label + '.zip', raw)
              records.append({'label': label, 'path': path, 'api_status': 302, 'storage_status': status,
                  'sha256': hashlib.sha256(raw).hexdigest(), 'size_bytes': len(raw),
                  'locator_retention': 'omitted_ephemeral_storage_credentials'})
              return raw
          
          def output(values):
              assert all(re.fullmatch(r'[a-z_]+', key) and type(value) is str and 0 < len(value) <= 1024
                         and not any(ord(c) < 32 or ord(c) == 127 for c in value) for key, value in values.items())
              with Path(os.environ['GITHUB_OUTPUT']).open('a') as stream:
                  for key, value in values.items():
                      stream.write(key + '=' + value + '\n')
          
          def identity(*, waiting=False):
              run = api('run-' + PHASE, BASE + '/actions/runs/' + str(RUN))
              assert run['id'] == RUN and run['run_attempt'] == ATTEMPT and run['event'] == 'pull_request'
              assert run['repository']['id'] == run['head_repository']['id'] == 1447925554
              references = [row for row in run['referenced_workflows'] if row['path'].split('@')[0] ==
                  'taipei49314/delivery-review/.github/workflows/pytest-producer.yml']
              assert len(references) == 1 and references[0]['sha'] == PRODUCER
              selected = None
              for attempt in range(30 if waiting else 1):
                  jobs = api('jobs-' + PHASE + '-' + str(attempt),
                      BASE + '/actions/runs/' + str(RUN) + '/attempts/' + str(ATTEMPT) + '/jobs?per_page=100&page=1')
                  assert jobs['total_count'] == len(jobs['jobs']) <= 10
                  matches = [row for row in jobs['jobs'] if row['name'] == 'pytest-linux / pytest-linux']
                  assert len(matches) <= 1
                  if matches:
                      selected = matches[0]
                      break
                  assert waiting
                  time.sleep(1)
              assert selected is not None and selected['run_id'] == RUN and selected['head_sha'] == run['head_sha']
              assert selected.get('run_attempt', ATTEMPT) == ATTEMPT
              path = BASE + '/check-runs/'
              check_url = selected['check_run_url']
              assert check_url.startswith('https://api.github.com' + path)
              check_id = positive(check_url.removeprefix('https://api.github.com' + path))
              check = api('check-' + PHASE, path + str(check_id))
              assert check['id'] == check_id and check['name'] == selected['name'] and check['app']['id'] == 15368
              assert check['head_sha'] == run['head_sha'] and check['check_suite']['id'] == run['check_suite_id']
              if not waiting:
                  assert selected['status'] == check['status'] == 'completed'
                  assert selected['conclusion'] == check['conclusion'] == 'success'
              return {'run_id': RUN, 'attempt': ATTEMPT, 'job_id': selected['id'], 'check_run_id': check_id,
                      'head_sha': run['head_sha'], 'name': f'delivery-review-{RUN}-{ATTEMPT}-{check_id}'}
          
          def scoped_metadata(label, artifact_id, binding):
              value = api(label, BASE + '/actions/artifacts/' + str(artifact_id))
              assert value['id'] == artifact_id and value['name'] == binding['name'] and value['expired'] is False
              assert value['workflow_run']['id'] == RUN and value['workflow_run']['head_sha'] == binding['head_sha']
              assert value['workflow_run']['repository_id'] == value['workflow_run']['head_repository_id'] == 1447925554
              assert re.fullmatch(r'sha256:[0-9a-f]{64}', value['digest'])
              return value
          
          try:
              if PHASE == 'prepare-replace':
                  binding = identity()
                  listing = api('original-listing', BASE + '/actions/runs/' + str(RUN) + '/artifacts?per_page=100&page=1')
                  assert listing['total_count'] == len(listing['artifacts']) == 1
                  artifact_id = listing['artifacts'][0]['id']
                  metadata = scoped_metadata('original-metadata', artifact_id, binding)
                  raw = archive('original', artifact_id)
                  digest = hashlib.sha256(raw).hexdigest()
                  assert metadata['digest'] == 'sha256:' + digest
                  # Discovery contains signed temporary URLs; keep only digest/size.
                  query = urllib.parse.urlencode({'per_page': '10', 'predicate_type': PREDICATE})
                  path = BASE + '/attestations/sha256:' + digest + '?' + query
                  status, _, discovery = request('https://api.github.com' + path, authorized=True)
                  assert status == 200
                  entries = json.loads(discovery)['attestations']
                  assert 1 <= len(entries) <= 10
                  discovery_record = {'request_path': path, 'status': status, 'sha256': hashlib.sha256(discovery).hexdigest(),
                      'size_bytes': len(discovery), 'body_retention': 'omitted_ephemeral_storage_credentials', 'bundles': []}
                  for index, entry in enumerate(entries):
                      assert entry['repository_id'] == 1447925554
                      code, _, bundle = request(storage(entry['bundle_url']))
                      assert code == 200
                      name = 'original-bundle-' + str(index) + '.json'
                      save(name, bundle)
                      discovery_record['bundles'].append({'file': name, 'sha256': hashlib.sha256(bundle).hexdigest()})
                  save('original-attestation-discovery.json', json.dumps(discovery_record, indent=2).encode())
                  binding.update(artifact_id=artifact_id, sha256=digest, producer_sha=PRODUCER)
                  save('binding.json', json.dumps(binding, indent=2).encode())
                  replacement = ROOT / 'replacement'
                  replacement.mkdir(mode=0o700)
                  (replacement / binding['name']).write_bytes(raw)
                  output({'evidence_directory': str(EVIDENCE), 'replacement_path': str(replacement / binding['name']),
                          'preservation_name': f'qualification-lifecycle-original-{RUN}-{ATTEMPT}'})
              elif PHASE == 'delete':
                  binding = json.loads((EVIDENCE / 'binding.json').read_bytes())
                  assert binding['run_id'] == RUN and binding['attempt'] == ATTEMPT
                  preserved_id = positive(os.environ['PRESERVATION_ID'])
                  preserved = api('preservation-metadata', BASE + '/actions/artifacts/' + str(preserved_id))
                  assert preserved_id != binding['artifact_id'] and preserved['workflow_run']['id'] == RUN
                  assert preserved['name'] == f'qualification-lifecycle-original-{RUN}-{ATTEMPT}' and not preserved['expired']
                  assert preserved['digest'] == 'sha256:' + os.environ['PRESERVATION_DIGEST']
                  preserved_bytes = archive('preservation', preserved_id)
                  assert hashlib.sha256(preserved_bytes).hexdigest() == os.environ['PRESERVATION_DIGEST']
                  required = {'binding.json', 'original.zip', 'original-metadata.json', 'original-listing.json',
                              'original-attestation-discovery.json', 'requests-prepare-replace.json'}
                  required.update(path.name for path in EVIDENCE.glob('original-bundle-*.json'))
                  with zipfile.ZipFile(io.BytesIO(preserved_bytes)) as bundle:
                      assert len(bundle.namelist()) == len(set(bundle.namelist()))
                      assert required <= set(bundle.namelist())
                      for name in required:
                          expected = (EVIDENCE / name).read_bytes()
                          assert bundle.getinfo(name).file_size == len(expected)
                          assert bundle.read(name) == expected
                  original = scoped_metadata('immediate-before-delete', binding['artifact_id'], binding)
                  assert original['digest'] == 'sha256:' + binding['sha256']
                  assert hashlib.sha256((EVIDENCE / 'original.zip').read_bytes()).hexdigest() == binding['sha256']
                  api('delete-original', BASE + '/actions/artifacts/' + str(binding['artifact_id']), method='DELETE', expected=204)
              elif PHASE == 'verify':
                  binding = json.loads((EVIDENCE / 'binding.json').read_bytes())
                  assert binding['run_id'] == RUN and binding['attempt'] == ATTEMPT
                  replacement_id = positive(os.environ['REPLACEMENT_ID'])
                  assert replacement_id != binding['artifact_id']
                  replacement = scoped_metadata('replacement-metadata', replacement_id, binding)
                  raw = archive('replacement', replacement_id)
                  result = {'kind': 'actual-authored-artifact-lifecycle-control', 'run_id': RUN, 'attempt': ATTEMPT,
                      'original_id': binding['artifact_id'], 'replacement_id': replacement_id, 'same_name': True,
                      'original_sha256': binding['sha256'], 'replacement_sha256': hashlib.sha256(raw).hexdigest(),
                      'same_zip_bytes': raw == (EVIDENCE / 'original.zip').read_bytes(),
                      'original_preservation_artifact_id': positive(os.environ['PRESERVATION_ID']),
                      'qualification': 'NOT_RUN; independent verifier must refuse replacement identity'}
                  save('result.json', json.dumps(result, indent=2).encode())
                  assert replacement['digest'] == 'sha256:' + result['replacement_sha256']
                  assert result['same_zip_bytes']
              elif PHASE == 'precreate':
                  binding = identity(waiting=True)
                  payload = ROOT / 'precreated'
                  payload.mkdir(mode=0o700)
                  (payload / 'authored.txt').write_bytes(b'Authored caller precreation; not producer evidence.\n')
                  save('precreation-binding.json', json.dumps(binding, indent=2).encode())
                  output({'artifact_name': binding['name'], 'artifact_directory': str(payload), 'evidence_directory': str(EVIDENCE)})
              else:
                  binding = json.loads((EVIDENCE / 'precreation-binding.json').read_bytes())
                  value = scoped_metadata('precreated-metadata', positive(os.environ['PRECREATED_ID']), binding)
                  save('precreation-result.json', json.dumps({'kind': 'actual-authored-artifact-precreation',
                      'binding': binding, 'artifact_id': value['id'], 'sha256': value['digest'],
                      'qualification': 'NOT_RUN; producer upload result must be independently observed'}, indent=2).encode())
          finally:
              save('requests-' + PHASE + '.json', json.dumps(records, indent=2).encode())
          AUTHORED_CONTROLLER
          python3 -I "$RUNNER_TEMP/authored-artifact-control/controller.py" prepare-replace
      - name: Preserve original artifact and signed bundle before deletion
        id: preserve
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.prepare.outputs.preservation_name }}
          path: ${{ steps.prepare.outputs.evidence_directory }}
          compression-level: 0
          overwrite: false
          if-no-files-found: error
          retention-days: 30
      - name: Delete only the preserved artifact from this new run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PRESERVATION_ID: ${{ steps.preserve.outputs.artifact-id }}
          PRESERVATION_DIGEST: ${{ steps.preserve.outputs.artifact-digest }}
        run: python3 -I "$RUNNER_TEMP/authored-artifact-control/controller.py" delete
      - name: Recreate identical ZIP bytes with the same name and a new ID
        id: replacement
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          path: ${{ steps.prepare.outputs.replacement_path }}
          archive: false
          overwrite: false
          if-no-files-found: error
          retention-days: 30
      - name: Observe replacement identity and exact byte equality
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPLACEMENT_ID: ${{ steps.replacement.outputs.artifact-id }}
          PRESERVATION_ID: ${{ steps.preserve.outputs.artifact-id }}
        run: python3 -I "$RUNNER_TEMP/authored-artifact-control/controller.py" verify
      - name: Preserve original qualification controller evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qualification-artifact-replace-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/authored-artifact-control/evidence
          compression-level: 0
          overwrite: false
          if-no-files-found: error
          retention-days: 30
